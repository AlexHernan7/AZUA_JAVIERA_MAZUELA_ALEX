<header class="sticky top-0 z-50 bg-white shadow-header">
  <nav class="mx-auto max-w-screen-xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">

      <!-- Logo + nombre -->
      <a routerLink="/home" class="flex items-center gap-2" aria-label="VecindApp - inicio">
        <img src="assets/images/Logo_vecindapp.png" alt="VecindApp" class="h-8 w-auto" />
        <span class="text-lg font-semibold tracking-tight">
          <span class="text-brand-teal">Vecind</span><span class="text-brand-gray">App</span>
        </span>
      </a>

      <!-- Links desktop -->
      <div class="hidden lg:flex items-center gap-6">
        <a routerLink="/home" routerLinkActive="text-brand-teal"
           class="text-sm text-gray-700 hover:text-brand-teal transition">Inicio</a>
        <a routerLink="/certificados" routerLinkActive="text-brand-teal"
           class="text-sm text-gray-700 hover:text-brand-teal transition">Certificados</a>
        <a routerLink="/reservas" routerLinkActive="text-brand-teal"
           class="text-sm text-gray-700 hover:text-brand-teal transition">Reservas</a>
        <a routerLink="/noticias" routerLinkActive="text-brand-teal"
           class="text-sm text-gray-700 hover:text-brand-teal transition">Noticias</a>
        <a routerLink="/perfil" routerLinkActive="text-brand-teal"
           class="text-sm text-gray-700 hover:text-brand-teal transition">Mi Perfil</a>
      </div>

      <!-- Acciones (desktop) -->
      <div class="hidden lg:flex items-center gap-3">
        <a routerLink="/login"
           class="text-sm px-3 py-1.5 rounded-md border border-brand-teal text-brand-teal hover:bg-brand-teal hover:text-white transition">
          Ingresar
        </a>
        <a routerLink="/registro"
           class="text-sm px-3 py-1.5 rounded-md bg-brand-orange text-white hover:opacity-90 transition">
          Registrarse
        </a>
      </div>

      <!-- Botón móvil -->
      <button type="button" (click)="toggleMobile()"
              class="lg:hidden inline-flex items-center justify-center rounded-md p-2 text-gray-700
                     hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-brand-teal"
              aria-label="Abrir menú">
        <svg *ngIf="!mobileOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg *ngIf="mobileOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </nav>

  <!-- Panel móvil -->
  <div class="lg:hidden" *ngIf="mobileOpen">
    <div class="space-y-1 px-4 pb-4 pt-2 shadow-inner">
      <a (click)="closeMobile()" routerLink="/home" routerLinkActive="bg-gray-100"
         class="block rounded-md px-3 py-2 text-gray-800 hover:bg-gray-100">Inicio</a>
      <a (click)="closeMobile()" routerLink="/certificados" routerLinkActive="bg-gray-100"
         class="block rounded-md px-3 py-2 text-gray-800 hover:bg-gray-100">Certificados</a>
      <a (click)="closeMobile()" routerLink="/reservas" routerLinkActive="bg-gray-100"
         class="block rounded-md px-3 py-2 text-gray-800 hover:bg-gray-100">Reservas</a>
      <a (click)="closeMobile()" routerLink="/noticias" routerLinkActive="bg-gray-100"
         class="block rounded-md px-3 py-2 text-gray-800 hover:bg-gray-100">Noticias</a>
      <a (click)="closeMobile()" routerLink="/perfil" routerLinkActive="bg-gray-100"
         class="block rounded-md px-3 py-2 text-gray-800 hover:bg-gray-100">Mi Perfil</a>

      <div class="mt-2 flex gap-2 px-3">
        <a (click)="closeMobile()" routerLink="/login"
           class="flex-1 text-center text-sm px-3 py-2 rounded-md border border-brand-teal text-brand-teal hover:bg-brand-teal hover:text-white transition">
          Ingresar
        </a>
        <a (click)="closeMobile()" routerLink="/registro"
           class="flex-1 text-center text-sm px-3 py-2 rounded-md bg-brand-orange text-white hover:opacity-90 transition">
          Registrarse
        </a>
      </div>
    </div>
  </div>
</header>
