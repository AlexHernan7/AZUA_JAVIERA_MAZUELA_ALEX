<div class=" register-fondo py-5 " style=" background: url('/images/parque-fondo1.png') center/cover no-repeat;">
  <div class="mx-auto register-card shadow rounded-4 p-4 p-md-5" style="max-width: 900px; background: rgba(255,255,255,.9);">
    <!-- Títulos -->
    <div class="text-center mb-4">
      <h1 class="fw-bold text-teal-750 mb-1">Inscríbete en VecindApp</h1>
      <p class="text-muted mb-0">Crea tu cuenta y valida tu residencia</p>
      <hr>
    </div>

    <!-- FORM -->
    <form class="row g-3" (ngSubmit)="onRegister()" #registerForm="ngForm">
      
      <!-- Mostrar mensajes de error y éxito -->
      <div class="col-12" *ngIf="errorMessage || successMessage">
        <div class="alert alert-danger py-2 small" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
        <div class="alert alert-success py-2 small" *ngIf="successMessage">
          {{ successMessage }}
        </div>
      </div>

      <!-- FOTO PERFIL (primero) -->
      <div class="col-12">
        <label class="form-label fw-semibold">Foto de perfil</label>
        <div class="d-flex align-items-center gap-3 flex-wrap">
          <div class="avatar-preview border">
            <img [src]="photoPreview || 'images/avatar-placeholder2.svg'" alt="Foto de perfil">
          </div>

          <div class="ms-3">
            <label class="btn btn-outline-teal-menu fw-medium me-5 mb-2">
              Subir imagen
              <input type="file" class="d-none" accept="image/*" (change)="onFileChange($event)">
            </label>
            <div class="small text-muted">Formatos: JPG/PNG. Tamaño sugerido 400×400.</div>
          </div>
        </div>
      </div>

      <!-- Nombres y Apellidos -->
      <div class="col-12 col-md-6">
        <label class="form-label fw-semibold">Nombres *</label>
        <input 
          type="text" 
          class="form-control" 
          placeholder="Tus nombres"
          [(ngModel)]="registerData.nombres"
          name="nombres"
          required
          [disabled]="isLoading">
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label fw-semibold">Apellido Paterno *</label>
        <input 
          type="text" 
          class="form-control" 
          placeholder="Paterno"
          [(ngModel)]="registerData.apellido_paterno"
          name="apellido_paterno"
          required
          [disabled]="isLoading">
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label fw-semibold">Apellido Materno *</label>
        <input 
          type="text" 
          class="form-control" 
          placeholder="Materno"
          [(ngModel)]="registerData.apellido_materno"
          name="apellido_materno"
          required
          [disabled]="isLoading">
      </div>

      <!-- RUT, Fecha nacimiento -->
      <div class="col-12 col-md-4">
        <label class="form-label fw-semibold">RUT *</label>
        <input 
          type="text" 
          class="form-control" 
          placeholder="12.345.678-9"
          [(ngModel)]="registerData.rut"
          name="rut"
          required
          [disabled]="isLoading">
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label fw-semibold">Fecha de nacimiento *</label>
        <input 
          type="date" 
          class="form-control"
          [(ngModel)]="registerData.fecha_nacimiento"
          name="fecha_nacimiento"
          required
          [disabled]="isLoading">
      </div>

      <!-- Teléfono -->
      <div class="col-12 col-md-4">
        <label class="form-label fw-semibold">Teléfono *</label>
        <input 
          type="tel" 
          class="form-control" 
          placeholder="+56 9 1234 5678"
          [(ngModel)]="registerData.telefono"
          name="telefono"
          required
          [disabled]="isLoading">
      </div>

      <!-- Dirección -->
      <div class="col-12">
        <label class="form-label fw-semibold">Dirección *</label>
        <input 
          type="text" 
          class="form-control" 
          placeholder="Calle, número, depto"
          [(ngModel)]="registerData.direccion"
          name="direccion"
          required
          [disabled]="isLoading">
      </div>

      <!-- Región / Comuna -->
      <div class="col-12 col-md-6">
  <label class="form-label fw-semibold">Región</label>
  <select class="form-select"
          (change)="onRegionChange($event)"
          [(ngModel)]="regionSeleccionada"
          name="region">
    <option value="" disabled selected>Selecciona una región</option>
    <option *ngFor="let region of regiones" [value]="region">{{ region }}</option>
  </select>
</div>
      <div class="col-12 col-md-6">
  <label class="form-label fw-semibold">Comuna</label>
  <select class="form-select"
          [(ngModel)]="comunaSeleccionada"
          name="comuna">
    <option value="" disabled selected>Selecciona una comuna</option>
    <option *ngFor="let comuna of comunas" [value]="comuna">{{ comuna }}</option>
  </select>
</div>

      <div class="col-12 col-md-12">
        <label class="form-label fw-semibold">Junta de Vecinos</label>
        <select class="form-select">
          <option value="" selected>Selecciona una junta de vecinos</option>
          <option value="" >Junta de Vecinos Barrio Oeste</option>
          <!-- TODO: opciones -->
        </select>
      </div>
      

      <!-- Correo / Contraseña -->
      <div class="col-12 col-md-6">
        <label class="form-label fw-semibold">Correo electrónico *</label>
        <input 
          type="email" 
          class="form-control" 
          placeholder="tucorreo@correo.com"
          [(ngModel)]="registerData.email"
          name="email"
          required
          [disabled]="isLoading">
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label fw-semibold">Contraseña *</label>
        <input 
          type="password" 
          class="form-control" 
          placeholder="8-12 caracteres"
          [(ngModel)]="registerData.password"
          name="password"
          required
          minlength="8"
          maxlength="12"
          [disabled]="isLoading">
      </div>

      <!-- Checks -->
      <div class="col-12 mt-4">
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="chkTyC">
          <label class="form-check-label" for="chkTyC">
            Acepto los <a href="#" class="text-teal-700 text-decoration-none fw-semibold">Términos y Condiciones</a>
          </label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="chkNews">
          <label class="form-check-label" for="chkNews">
            Deseo recibir noticias y actividades
          </label>
        </div>
      </div>

      <!-- CTA -->
      <div class="col-12 mt-5 d-flex justify-content-center gap-4">
        <button 
          type="submit" 
          class="btn btn-cta1 py-2 px-4"
          [disabled]="isLoading">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          {{ isLoading ? 'Creando cuenta...' : 'Crear cuenta' }}
        </button>
        <button 
          type="button" 
          class="btn btn-cta2 py-2 px-4"
          (click)="goBack()"
          [disabled]="isLoading">
          Volver
        </button>
      </div>

      <div class="col-12 text-center">
        <a 
          href="javascript:void(0)" 
          class="text-teal-700 text-decoration-none fw-semibold small"
          (click)="goToLogin()">
          Ya tengo cuenta
        </a>
      </div>
    </form>
  </div>
</div>
