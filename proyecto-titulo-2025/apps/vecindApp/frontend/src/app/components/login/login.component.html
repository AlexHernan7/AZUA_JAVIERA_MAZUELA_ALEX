<div class="login-bg d-flex align-items-center justify-content-center " style=" background: url('/images/fondo_login.png') center / cover no-repeat fixed;">
  <div class="card login-card shadow-lg border-0 p-4" style="max-width: 420px; width: 92%;">
    <!-- Logo y título -->
    <div class="text-center mb-4">
      <img src="/images/Logo_vecindapp.png" alt="VecindApp" class="img-fluid mb-2" style="max-width: 13rem;">
      <p class="text-teal-600 fs-4 fw-semibold mb-0">Bienvenido a tu comunidad!</p>
    </div>

    <!-- Formulario -->
    <form class="d-grid gap-3">
      <div class="input-group">
        <span class="input-group-text bg-white border-teal-200">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="#79909a" stroke-width="1.6" viewBox="0 0 24 24">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/>
          </svg>
        </span>
        <input type="email" class="form-control border-teal-200" placeholder="Correo electrónico">
      </div>

      <div class="input-group">
        <span class="input-group-text bg-white border-teal-200">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="#79909a" stroke-width="1.6" viewBox="0 0 24 24">
            <rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 1 1 8 0v3"/>
          </svg>
        </span>
        <input type="password" class="form-control border-teal-200" placeholder="Contraseña">
      </div>

      <button type="button" class="btn btn-teal-menu fw-semibold py-2">Ingresar</button>
    </form>

    <div class="text-center mt-4">
      <a href="#" class="d-block text-sm text-teal-700 text-decoration-none mb-2">¿Olvidaste tu contraseña?</a>
      <a href="#" class="d-block text-sm text-teal-700 text-decoration-none">Registrarme como vecino</a>
    </div>
  </div>
</div>
