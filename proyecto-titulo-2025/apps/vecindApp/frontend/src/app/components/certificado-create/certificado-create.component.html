<div class="container-xxl py-3">
  <h1 class="display-6 fw-bold text-ink-900 mb-2">Certificado de Residencia</h1>
  <p class="text-muted mb-3">Verifica tus datos y continúa con el pago.</p>

  <div class="card border-0 shadow-soft rounded-4">
    <div class="card-body p-3 p-md-4">

      <!-- Datos del solicitante (solo lectura) -->
      <div class="border rounded-3 p-3 mb-3 readonly-block">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold">Nombre</label>
            <input class="form-control" [value]="nombreCompleto" readonly>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold">RUT</label>
            <input class="form-control" [value]="rut" readonly>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold">Dirección</label>
            <input class="form-control" [value]="direccion" readonly>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold">Comuna</label>
            <input class="form-control" [value]="comuna" readonly>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold">Región</label>
            <input class="form-control" [value]="region" readonly>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold">Teléfono</label>
            <input class="form-control" [value]="telefono" readonly>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold">Junta de vecinos</label>
            <input class="form-control" [value]="junta" readonly>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold">Fecha de emisión</label>
            <input class="form-control" [value]="fechaEmisionTexto" readonly>
          </div>
        </div>
      </div>

      <!-- Formulario (motivo + confirmación) -->
      <form [formGroup]="form" class="mb-3">
        <!-- Motivo (combo con grupos) -->
        <div class="border rounded-3 p-3 mb-3">
          <label class="form-label fw-semibold">Motivo de la solicitud *</label>
          <select class="form-select" formControlName="motivo">
            <option value="" disabled selected>Selecciona un motivo</option>
            <optgroup *ngFor="let g of motivosCatalog" [label]="g.grupo">
              <option *ngFor="let op of g.items" [value]="op">{{ op }}</option>
            </optgroup>
          </select>
          <div class="invalid mt-2" *ngIf="form.get('motivo')?.touched && form.get('motivo')?.invalid">
            Debes seleccionar un motivo.
          </div>
        </div>

        <!-- Confirmación -->
        <div class="form-check">
          <input id="chkConfirmo" class="form-check-input" type="checkbox" formControlName="confirmo">
          <label for="chkConfirmo" class="form-check-label">Declaro que los datos son correctos</label>
        </div>
      </form>

      <!-- Acciones -->
      <div class="d-flex flex-column flex-md-row gap-3">
        <button type="button"
        class="btn btn-teal-menu flex-fill"
        [disabled]="!form.value.confirmo || !form.get('motivo')?.value"
        (click)="onPagarClick()">
  Ir a pagar
</button>

        <button type="button"
        class="btn btn-download flex-fill"
        disabled
        (click)="onDescargarClick()">
  <i class="bi bi-lock me-1"></i>
  Descargar PDF
  <small class="d-block">Disponible tras el pago</small>
</button>
      </div>

      <!-- Info pie -->
      <div class="small text-muted border rounded-3 p-2 mt-3">
        Monto: <strong>$ 2000</strong> &nbsp;/&nbsp; Medio: <strong>Transbank</strong>
      </div>
    </div>
  </div>
</div>
