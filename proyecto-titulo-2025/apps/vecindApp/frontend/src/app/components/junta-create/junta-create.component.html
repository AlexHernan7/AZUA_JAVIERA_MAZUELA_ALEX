<div class="container-xxl py-3">
  <h1 class="display-6 fw-bold text-ink-900 mb-1 ms-3">Crear Junta de Vecinos</h1>
  <p class="text-muted mb-4 ms-3">Registra una nueva Junta de Vecinos en el sistema</p>

  <div class="card border-0 shadow-soft rounded-4">
    <div class="card-body p-3 p-md-4">
      <form [formGroup]="form" (ngSubmit)="submitUI()" class="row g-3 g-md-4">

        <!-- Alertas -->
        <div class="col-12" *ngIf="errorMessage || successMessage">
          <div class="alert alert-danger py-2" *ngIf="errorMessage">{{ errorMessage }}</div>
          <div class="alert alert-success py-2" *ngIf="successMessage">{{ successMessage }}</div>
        </div>

        <!-- Logo -->
        <div class="col-12 col-md-3">
          <div class="logo-box border rounded-4 p-3 text-center">
            <img [src]="logoPreview || 'images/Logo_vecindapp_menu.png'" alt="Logo" class="logo-img mb-3">
            <label class="btn btn-outline-teal-menu w-100">
              Subir logo
              <input type="file" class="d-none" accept="image/*" (change)="onLogoChange($event)">
            </label>
          </div>
        </div>

        <div class="col-12 col-md-9">
          <div class="row g-3">

            <div class="col-12">
              <label class="form-label fw-semibold">Nombre *</label>
              <input class="form-control" formControlName="nombre" placeholder="Junta de Vecinos Barrio Oeste" autocomplete="organization">
              <div class="invalid" *ngIf="g('nombre').touched && g('nombre').invalid">Obligatorio (mín. 3)</div>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label fw-semibold">RUT (personalidad jurídica)</label>
              <input class="form-control" formControlName="rut_personeria" placeholder="12.345.678-9" autocomplete="off">
              <div class="invalid" *ngIf="g('rut_personeria').touched && g('rut_personeria').invalid">RUT inválido</div>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label fw-semibold">Correo de contacto *</label>
              <input type="email" class="form-control" formControlName="email_contacto" placeholder="contacto@junta.cl" autocomplete="email">
              <div class="invalid" *ngIf="g('email_contacto').touched && g('email_contacto').invalid">Email inválido</div>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label fw-semibold">Teléfono de contacto *</label>
              <input class="form-control" formControlName="telefono_contacto" placeholder="+569XXXXXXXX" autocomplete="tel">
              <div class="invalid" *ngIf="g('telefono_contacto').touched && g('telefono_contacto').invalid">Formato +56XXXXXXXXX</div>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label fw-semibold">Dirección de la sede *</label>
              <input class="form-control" formControlName="direccion_sede" placeholder="Calle, número, depto" autocomplete="street-address">
              <div class="invalid" *ngIf="g('direccion_sede').touched && g('direccion_sede').invalid">Obligatorio</div>
            </div>

            <!-- Región/Comuna -->
            <div class="col-12 col-md-6">
              <label class="form-label fw-semibold">Región *</label>
              <select class="form-select" formControlName="region">
                <option value="" disabled>Selecciona una región</option>
                <option *ngFor="let region of regiones" [value]="region.id_region">{{ region.nombre }}</option>
              </select>
              <div class="invalid" *ngIf="g('region').touched && g('region').invalid">Selecciona una región</div>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label fw-semibold">Comuna *</label>
              <select class="form-select" formControlName="comuna">
                <option value="" disabled>Selecciona una comuna</option>
                <option *ngFor="let comuna of comunas" [value]="comuna.id_comuna">{{ comuna.nombre }}</option>
              </select>
              <div class="invalid" *ngIf="g('comuna').touched && g('comuna').invalid">Selecciona una comuna</div>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label fw-semibold">Fecha de constitución</label>
              <input type="date" class="form-control" formControlName="fecha_constitucion">
            </div>

            <div class="col-12 col-md-6 d-flex align-items-end">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" formControlName="activa" id="chkActiva">
                <label class="form-check-label" for="chkActiva">Junta activa</label>
              </div>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Descripción</label>
              <textarea rows="3" class="form-control" formControlName="descripcion" placeholder="Breve descripción, objetivos, etc."></textarea>
            </div>

          </div>
        </div>

        <!-- Acciones -->
        <div class="col-12 d-flex gap-3 justify-content-end pt-2">
          <button type="button" class="btn btn-outline-teal-menu" (click)="cancelUI()" [disabled]="isLoading">Cancelar</button>
          <button type="submit" class="btn btn-teal-menu" [disabled]="isLoading">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            Crear Junta
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
